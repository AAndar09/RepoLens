name: repolens

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repolens}
      POSTGRES_USER: ${POSTGRES_USER:-repolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-non-local-use}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repolens} -d ${POSTGRES_DB:-repolens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    environment:
      REPOLENS_DATABASE_URL: ${REPOLENS_DATABASE_URL:-postgresql+psycopg://repolens:change-me-for-non-local-use@postgres:5432/repolens}
      REPOLENS_CORS_ORIGINS: ${REPOLENS_CORS_ORIGINS:-http://localhost:5173}
      REPOLENS_ALLOWED_HOSTS: ${REPOLENS_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}
      REPOLENS_RATE_LIMIT_ENABLED: ${REPOLENS_RATE_LIMIT_ENABLED:-true}
      REPOLENS_MAX_REQUEST_BODY_BYTES: ${REPOLENS_MAX_REQUEST_BODY_BYTES:-65536}
      REPOLENS_RATE_LIMIT_DEFAULT_REQUESTS: ${REPOLENS_RATE_LIMIT_DEFAULT_REQUESTS:-120}
      REPOLENS_RATE_LIMIT_SUBMISSION_REQUESTS: ${REPOLENS_RATE_LIMIT_SUBMISSION_REQUESTS:-10}
      REPOLENS_RATE_LIMIT_INGESTION_REQUESTS: ${REPOLENS_RATE_LIMIT_INGESTION_REQUESTS:-4}
      REPOLENS_RATE_LIMIT_QUERY_REQUESTS: ${REPOLENS_RATE_LIMIT_QUERY_REQUESTS:-30}
      REPOLENS_INGESTION_INCLUDE_GLOBS: ${REPOLENS_INGESTION_INCLUDE_GLOBS:-*.py}
      REPOLENS_INGESTION_EXCLUDE_GLOBS: ${REPOLENS_INGESTION_EXCLUDE_GLOBS:-}
      REPOLENS_INGESTION_EXCLUDE_DIRECTORIES: ${REPOLENS_INGESTION_EXCLUDE_DIRECTORIES:-.git,.hg,.svn,.venv,venv,node_modules,__pycache__,build,dist,.tox,.nox}
      REPOLENS_INGESTION_MAX_FILES: ${REPOLENS_INGESTION_MAX_FILES:-2500}
      REPOLENS_INGESTION_MAX_TOTAL_BYTES: ${REPOLENS_INGESTION_MAX_TOTAL_BYTES:-25000000}
      REPOLENS_INGESTION_MAX_FILE_BYTES: ${REPOLENS_INGESTION_MAX_FILE_BYTES:-1000000}
      REPOLENS_INGESTION_MAX_CLONE_BYTES: ${REPOLENS_INGESTION_MAX_CLONE_BYTES:-250000000}
      REPOLENS_INGESTION_CLONE_TIMEOUT_SECONDS: ${REPOLENS_INGESTION_CLONE_TIMEOUT_SECONDS:-120}
      REPOLENS_INGESTION_MAX_CONCURRENT_JOBS: ${REPOLENS_INGESTION_MAX_CONCURRENT_JOBS:-2}
      REPOLENS_INGESTION_MAX_QUEUED_JOBS: ${REPOLENS_INGESTION_MAX_QUEUED_JOBS:-100}
      REPOLENS_QDRANT_URL: ${REPOLENS_QDRANT_URL:-http://qdrant:6333}
      REPOLENS_QDRANT_COLLECTION: ${REPOLENS_QDRANT_COLLECTION:-repolens_code_units}
      REPOLENS_EMBEDDING_PROVIDER: ${REPOLENS_EMBEDDING_PROVIDER:-hashing}
      REPOLENS_EMBEDDING_DIMENSIONS: ${REPOLENS_EMBEDDING_DIMENSIONS:-384}
      REPOLENS_RETRIEVAL_MAX_UNIT_CHARS: ${REPOLENS_RETRIEVAL_MAX_UNIT_CHARS:-12000}
      REPOLENS_RETRIEVAL_MAX_UNITS_PER_SNAPSHOT: ${REPOLENS_RETRIEVAL_MAX_UNITS_PER_SNAPSHOT:-20000}
      REPOLENS_GRAPH_SOURCE_ROOTS: ${REPOLENS_GRAPH_SOURCE_ROOTS:-src}
      REPOLENS_LLM_PROVIDER: ${REPOLENS_LLM_PROVIDER:-gemini}
      REPOLENS_LLM_MODEL: ${REPOLENS_LLM_MODEL:-gemini-3.5-flash-lite}
      REPOLENS_LLM_FALLBACK_PROVIDER: ${REPOLENS_LLM_FALLBACK_PROVIDER:-groq}
      REPOLENS_LLM_FALLBACK_MODEL: ${REPOLENS_LLM_FALLBACK_MODEL:-openai/gpt-oss-20b}
      REPOLENS_LLM_TIMEOUT_SECONDS: ${REPOLENS_LLM_TIMEOUT_SECONDS:-90}
      REPOLENS_GEMINI_API_KEY: ${REPOLENS_GEMINI_API_KEY:-}
      REPOLENS_GEMINI_BASE_URL: ${REPOLENS_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      REPOLENS_GROQ_API_KEY: ${REPOLENS_GROQ_API_KEY:-}
      REPOLENS_GROQ_BASE_URL: ${REPOLENS_GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      REPOLENS_OPENROUTER_API_KEY: ${REPOLENS_OPENROUTER_API_KEY:-}
      REPOLENS_OPENROUTER_BASE_URL: ${REPOLENS_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      REPOLENS_OPENROUTER_SITE_URL: ${REPOLENS_OPENROUTER_SITE_URL:-}
      REPOLENS_OLLAMA_URL: ${REPOLENS_OLLAMA_URL:-http://host.docker.internal:11434}
      REPOLENS_AGENT_MAX_STEPS: ${REPOLENS_AGENT_MAX_STEPS:-4}
      REPOLENS_AGENT_MAX_TOOL_CALLS_PER_STEP: ${REPOLENS_AGENT_MAX_TOOL_CALLS_PER_STEP:-4}
      REPOLENS_AGENT_MAX_EVIDENCE_ITEMS: ${REPOLENS_AGENT_MAX_EVIDENCE_ITEMS:-30}
      REPOLENS_AGENT_MAX_SOURCE_LINES: ${REPOLENS_AGENT_MAX_SOURCE_LINES:-400}
      REPOLENS_AGENT_EVALUATION_MAX_EVIDENCE_CHARS: ${REPOLENS_AGENT_EVALUATION_MAX_EVIDENCE_CHARS:-16000}
      REPOLENS_DEPENDENCY_MAX_MANIFESTS: ${REPOLENS_DEPENDENCY_MAX_MANIFESTS:-100}
      REPOLENS_DEPENDENCY_MAX_RECORDS: ${REPOLENS_DEPENDENCY_MAX_RECORDS:-5000}
      REPOLENS_OSV_API_URL: ${REPOLENS_OSV_API_URL:-https://api.osv.dev}
      REPOLENS_OSV_TIMEOUT_SECONDS: ${REPOLENS_OSV_TIMEOUT_SECONDS:-20}
      REPOLENS_OSV_MAX_RESULTS_PER_DEPENDENCY: ${REPOLENS_OSV_MAX_RESULTS_PER_DEPENDENCY:-100}
      REPOLENS_EVALUATION_RESULTS_DIR: ${REPOLENS_EVALUATION_RESULTS_DIR:-evaluations/results}
      REPOLENS_EVALUATION_MAX_RESULTS: ${REPOLENS_EVALUATION_MAX_RESULTS:-50}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  frontend_node_modules:
